name: Sync workouts and deploy site

on:
  workflow_dispatch:
  schedule:
    # GitHub scheduled workflows use UTC. This runs daily at 7:17 UTC.
    - cron: '17 7 * * *'
  push:
    paths:
      - 'workouts/**'
      - '.github/workflows/workouts-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync workout sheet data
        run: node workouts/scripts/sync-workouts.cjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare complete site
        run: node workouts/scripts/prepare-site.cjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
